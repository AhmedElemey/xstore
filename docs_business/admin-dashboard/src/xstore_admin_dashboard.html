<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>xStore — Admin Dashboard (Design Prototype)</title>
<style>
:root{
    --primary:#2E5C6E; --primary-light:#5C8493; --primary-dark:#21454F;
    --accent:#C68A2E; --accent-light:#DBA850;
    --success:#3F7A5C; --success-bg:#DEEDE4;
    --warning:#B6811F; --warning-bg:#F5EAD3;
    --error:#B4472E; --error-bg:#F3E0D8;
    --info:#356F80; --info-bg:#DEE9EC;
    --bg:#FAF8F1; --surface:#FFFFFF; --line:#E7E2D5; --line-soft:#F1EDE3;
    --text:#1A2A24; --text-2:#5B655E; --text-3:#8C9189;
    --sidebar:#15211D; --sidebar-2:#213029; --sidebar-text:#B4C0B4;
    --radius:16px; --shadow:0 1px 3px rgba(20,33,29,.05),0 10px 26px rgba(20,33,29,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .app{display:flex;min-height:100vh}

  /* Sidebar */
  .sidebar{width:248px;background:var(--sidebar);color:var(--sidebar-text);position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;padding:18px 12px;z-index:20}
  .brand{display:flex;align-items:center;gap:10px;padding:8px 10px 18px}
  .brand .logo{width:34px;height:34px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:var(--sidebar);font-weight:800;font-size:18px}
  .brand b{color:#F3F1E8;font-size:16px;letter-spacing:.2px}
  .brand span{display:block;font-size:11px;color:var(--accent-light)}
  .nav-group{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:#7E8C7F;padding:14px 12px 6px}
  .nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:var(--sidebar-text);font-weight:500;cursor:pointer;position:relative}
  .nav a:hover{background:var(--sidebar-2);color:#fff}
  .nav a.active{background:linear-gradient(90deg,var(--primary),var(--primary-dark));color:#fff}
  .nav a svg{width:18px;height:18px;flex:0 0 18px}
  .nav a .badge{margin-left:auto;background:var(--accent);color:#fff;font-size:11px;font-weight:700;padding:1px 7px;border-radius:20px}
  .side-foot{margin-top:auto;padding:12px 10px;display:flex;align-items:center;gap:10px;border-top:1px solid #322e6e}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--primary-light);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
  .side-foot small{color:#8f8dc0;display:block}

  /* Main */
  .main{flex:1;margin-left:248px;min-width:0}
  .topbar{height:64px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 26px;position:sticky;top:0;z-index:10}
  .topbar h1{font-size:18px;font-weight:700}
  .search{margin-left:8px;flex:1;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--text-3)}
  .search input{border:none;background:none;outline:none;flex:1;font-size:13px;color:var(--text)}
  .top-actions{margin-left:auto;display:flex;align-items:center;gap:14px;color:var(--text-2)}
  .icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
  .icon-btn .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;background:var(--accent);border-radius:50%;border:2px solid #fff}
  .icon-btn svg{width:18px;height:18px}
  .search svg{width:16px;height:16px;flex:0 0 16px}
  .content{padding:26px}
  .view{display:none;animation:fade .25s ease}
  .view.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
  .page-head h2{font-size:22px;font-weight:800}
  .page-head p{color:var(--text-2);font-size:13px;margin-top:2px}

  /* Cards & grid */
  .grid{display:grid;gap:18px}
  .g-4{grid-template-columns:repeat(4,1fr)}
  .g-3{grid-template-columns:repeat(3,1fr)}
  .g-2{grid-template-columns:2fr 1fr}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .card .c-head{padding:16px 18px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between}
  .card .c-head h3{font-size:15px;font-weight:700}
  .card .c-body{padding:18px}
  .kpi{padding:18px}
  .kpi .k-top{display:flex;align-items:center;justify-content:space-between}
  .kpi .k-ico{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center}
  .kpi .k-val{font-size:27px;font-weight:800;margin-top:12px;letter-spacing:-.5px}
  .kpi .k-label{color:var(--text-2);font-size:12.5px;margin-top:2px}
  .trend{font-size:12px;font-weight:700;padding:2px 8px;border-radius:20px}
  .up{color:var(--success);background:var(--success-bg)}
  .down{color:var(--error);background:var(--error-bg)}

  /* Tables */
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-3);font-weight:700;padding:12px 18px;border-bottom:1px solid var(--line-soft);background:#F7F4EC}
  td{padding:13px 18px;border-bottom:1px solid var(--line-soft);font-size:13.5px;vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#FBF9F3}
  .u{display:flex;align-items:center;gap:10px}
  .u .ua{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:13px}
  .u b{font-weight:600}.u small{color:var(--text-3);display:block;font-size:12px}
  .money{font-variant-numeric:tabular-nums;font-weight:600}

  /* Badges */
  .badge-s{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:5px}
  .b-green{color:#2C6347;background:var(--success-bg)} .b-amber{color:#7E5A14;background:var(--warning-bg)}
  .b-red{color:#8A3A24;background:var(--error-bg)} .b-blue{color:#2A5666;background:var(--info-bg)}
  .b-grey{color:#4C554E;background:#ECE9DF} .b-indigo{color:#22505E;background:#D9E5E8}
  .dotb{width:7px;height:7px;border-radius:50%}

  /* Buttons */
  .btn{border:none;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
  .btn-p{background:var(--primary);color:#fff}.btn-p:hover{background:var(--primary-dark)}
  .btn-ok{background:var(--success);color:#fff}.btn-ok:hover{filter:brightness(.94)}
  .btn-no{background:#fff;color:var(--error);border:1px solid var(--error)}.btn-no:hover{background:var(--error-bg)}
  .btn-g{background:#fff;border:1px solid var(--line);color:var(--text-2)}.btn-g:hover{background:var(--bg)}
  .btn-sm{padding:6px 11px;font-size:12px}
  td.r .btn+.btn{margin-left:8px}

  /* Tabs / chips */
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .chip{padding:7px 14px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--text-2);font-size:13px;font-weight:600;cursor:pointer}
  .chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}

  /* Charts */
  .bars{display:flex;flex-direction:column;gap:12px}
  .bar-row{display:grid;grid-template-columns:120px 1fr 52px;align-items:center;gap:12px;font-size:13px}
  .bar-track{height:10px;background:var(--line-soft);border-radius:20px;overflow:hidden}
  .bar-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--primary-light),var(--primary))}
  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:12.5px;color:var(--text-2)}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:middle}

  /* Category cards */
  .cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .cat{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:#fff}
  .cat .ci{width:44px;height:44px;border-radius:12px;background:#EAF0F1;color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:20px}
  .cat .cmeta{flex:1}.cat .cmeta b{font-size:14.5px}.cat .cmeta small{color:var(--text-3);display:block}
  .switch{width:40px;height:22px;border-radius:20px;background:var(--success);position:relative;cursor:pointer;flex:0 0 40px}
  .switch.off{background:var(--line)}
  .switch::after{content:'';position:absolute;top:2px;left:20px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .switch.off::after{left:2px}

  /* Moderation cards */
  .mod{display:flex;gap:14px;padding:16px;border:1px solid var(--line);border-radius:12px;background:#fff;align-items:center}
  .mod .thumb{width:66px;height:66px;border-radius:10px;background:linear-gradient(135deg,#EAF0F1,#DAE6E9);display:flex;align-items:center;justify-content:center;font-size:26px;flex:0 0 66px}
  .mod .minfo{flex:1;min-width:0}
  .mod .minfo b{font-size:15px}.mod .minfo p{color:var(--text-2);font-size:12.5px;margin-top:2px}
  .mod .mactions{display:flex;gap:8px}

  .split{display:grid;grid-template-columns:2fr 1fr;gap:18px}
  .list-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-soft)}
  .list-row:last-child{border-bottom:none}
  .toast{position:fixed;bottom:24px;right:24px;background:#111827;color:#fff;padding:12px 18px;border-radius:11px;font-size:13.5px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;transform:translateY(12px);transition:.28s;z-index:99}
  .toast.show{opacity:1;transform:none}
  .muted{color:var(--text-2)} .r{text-align:right} .mt{margin-top:18px}
  .donut-wrap{display:flex;align-items:center;gap:22px}
  .banner{border:1px dashed var(--line);border-radius:12px;padding:16px;display:flex;gap:14px;align-items:center}
  .banner .bimg{width:120px;height:64px;border-radius:9px;background:linear-gradient(120deg,var(--primary),var(--accent));flex:0 0 120px}
  .form-row{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
  .form-row label{font-size:12.5px;font-weight:600;color:var(--text-2)}
  .form-row input,.form-row select{padding:9px 12px;border:1px solid var(--line);border-radius:9px;font-size:13.5px;font-family:inherit}

  /* Drawer / detail panel */
  .overlay{position:fixed;inset:0;background:rgba(17,24,39,.42);opacity:0;pointer-events:none;transition:.25s;z-index:40}
  .overlay.show{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:430px;max-width:92vw;background:#fff;box-shadow:-12px 0 44px rgba(17,24,39,.18);transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:50;display:flex;flex-direction:column}
  .drawer.show{transform:none}
  .d-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .d-close{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-2);font-size:15px}
  .d-close:hover{background:var(--bg)}
  .d-body{padding:20px 22px;overflow:auto;flex:1}
  .kv{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line-soft);font-size:13.5px}
  .kv span{color:var(--text-2)} .kv b{text-align:right}

  /* Delivery requests (consumer package pilot) */
  .pkg-in{width:74px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit}
  .hint{display:block;font-size:11.5px;color:var(--text-3);margin-top:4px;font-weight:400}
  .route b{font-weight:600}
  .route small{color:var(--text-3);display:block;font-size:12px}

  /* Login screen */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px}
  .login-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px 26px}
  .login-error{background:var(--error-bg);color:#8A3A24;font-size:12.5px;font-weight:600;padding:10px 12px;border-radius:9px;margin-bottom:14px}

  /* Async view states */
  .state-card{text-align:center;padding:48px 24px;color:var(--text-2)}
  .state-card.error{color:#8A3A24}
  .state-card .btn{margin-top:14px}
  .api-note{font-size:12px;color:var(--text-3);background:var(--line-soft);border-radius:9px;padding:10px 12px;margin-bottom:16px}

  /* ---------- responsive (keep last: these must override the base rules above) ---------- */
  .menu-btn{display:none}
  @media(max-width:1050px){
    .g-4{grid-template-columns:repeat(2,1fr)}
    .g-2,.split{grid-template-columns:1fr}
    .cat-grid{grid-template-columns:1fr}
    .sidebar{transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1);box-shadow:12px 0 44px rgba(17,24,39,.18);z-index:45}
    .sidebar.open{transform:none}
    .main{margin-left:0}
    .menu-btn{display:flex}
  }
  @media(max-width:820px){
    .content{padding:18px}
    .topbar{padding:0 16px}
    .card{overflow-x:auto}
    .card>table{min-width:640px}
    .card th{white-space:nowrap;padding:10px 14px}
    .card td{white-space:nowrap;padding:11px 14px}
  }
  @media(max-width:640px){
    .g-4,.g-3{grid-template-columns:1fr}
    .content{padding:14px}
    .topbar{gap:10px;padding:0 12px}
    .topbar h1{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .search{min-width:0;margin-left:0}
    .search input{min-width:0}
    .top-actions{gap:8px}
    .hide-sm{display:none}
    .kpi .k-val{font-size:23px}
    .page-head h2{font-size:19px}
    .mod{flex-wrap:wrap}
    .mod .mactions{width:100%;justify-content:flex-end}
    .bar-row{grid-template-columns:86px 1fr 46px;gap:8px}
    .banner{flex-wrap:wrap}
    .banner .bimg{flex:0 0 96px;width:96px;height:52px}
    .toast{left:16px;right:16px;bottom:16px;text-align:center}
    .drawer{width:100vw;max-width:100vw}
  }

</style>
</head>
<body>
<!-- LOGIN SCREEN — shown when there's no stored JWT; see api.js (Auth) / app.js (login()) -->
<div class="login-wrap" id="loginScreen">
  <form class="login-card" id="loginForm" onsubmit="return handleLoginSubmit(event)">
    <div class="brand" style="padding:0 0 18px"><div class="logo">x</div><div><b style="color:var(--text)">xStore</b><span style="color:var(--text-3)">Admin Console</span></div></div>
    <div class="form-row"><label>API base URL</label><input id="liBase" placeholder="http://localhost:5000"></div>
    <div class="form-row"><label>Phone number</label><input id="liPhone" placeholder="01012345678" required autocomplete="username"></div>
    <div class="form-row"><label>Password</label><input id="liPass" type="password" placeholder="••••••••" required autocomplete="current-password"></div>
    <label style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-2);margin-bottom:14px"><input id="liRemember" type="checkbox" style="width:auto"> Remember me</label>
    <div id="loginError" class="login-error" style="display:none"></div>
    <button class="btn btn-p" id="loginSubmitBtn" type="submit" style="width:100%;justify-content:center">Sign in</button>
    <p class="muted" style="font-size:11.5px;margin-top:14px;text-align:center">ADMINISTRATOR or SUPERADMIN accounts only.</p>
  </form>
</div>

<div class="app" id="appShell" style="display:none">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand"><div class="logo">x</div><div><b>xStore</b><span>Admin Console</span></div></div>
    <div class="nav" id="nav">
      <div class="nav-group">Overview</div>
      <a data-view="overview" class="active"><i data-ic="grid"></i><span>Dashboard</span></a>
      <!-- PHASE 2 — <a data-view="analytics"><i data-ic="chart"></i><span>Analytics</span></a> -->
      <div class="nav-group">Marketplace</div>
      <a data-view="moderation"><i data-ic="shield"></i><span>Product Moderation</span><span class="badge">5</span></a>
      <a data-view="vendors"><i data-ic="store"></i><span>Vendors</span><span class="badge">3</span></a>
      <a data-view="categories"><i data-ic="tag"></i><span>Categories</span></a>
      <a data-view="orders"><i data-ic="box"></i><span>Orders</span></a>
      <!-- PHASE 2 — <a data-view="couriers"><i data-ic="truck"></i><span>Delivery</span><span class="badge">1</span></a> -->
      <!-- PHASE 2 — <a data-view="packages"><i data-ic="send"></i><span>Delivery Requests</span><span class="badge">1</span></a> -->
      <!-- PHASE 2 — <a data-view="disputes"><i data-ic="alert"></i><span>Disputes</span><span class="badge">6</span></a> -->
      <div class="nav-group">Growth</div>
      <a data-view="customers"><i data-ic="users"></i><span>Users</span></a>
      <!-- PHASE 2 — <a data-view="coupons"><i data-ic="ticket"></i><span>Coupons</span></a> -->
      <a data-view="content"><i data-ic="image"></i><span>Content &amp; Banners</span></a>
      <div class="nav-group">System</div>
      <a data-view="settings"><i data-ic="cog"></i><span>Settings</span></a>
    </div>
    <div class="side-foot"><div class="avatar">A</div><div><b style="color:#fff;font-size:13px">Admin</b><small>Signed in</small></div></div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div class="icon-btn menu-btn" onclick="toggleSidebar()"><i data-ic="menu"></i></div>
      <h1 id="topTitle">Dashboard</h1>
      <div class="search"><i data-ic="search"></i><input id="searchInput" placeholder="Search this page…"></div>
      <div class="top-actions">
        <div class="icon-btn"><i data-ic="bell"></i><span class="dot"></span></div>
        <div class="icon-btn hide-sm"><i data-ic="help"></i></div>
        <div class="icon-btn" id="logoutBtn" title="Sign out" onclick="handleLogout()">⏻</div>
        <div class="avatar" style="background:var(--primary)">A</div>
      </div>
    </div>
    <div class="content" id="content"><!-- views injected --></div>
  </div>
</div>
<div class="overlay" id="overlay" onclick="closeDrawer();closeSidebar()"></div>
<aside class="drawer" id="drawer"></aside>
<div class="toast" id="toast"></div>

<script>
/* ---------- xStore Admin Dashboard — backend API client ----------
 * Wraps the endpoints in ../BACKEND_HANDOFF.md / the "xStoreEcommerce Admin & Super
 * Admin" Postman collection. No build step — plain script, everything hangs off the
 * global `API` object so it can be called from inline onclick handlers like the rest
 * of app.js.
 *
 * Response shapes are not pinned down by the Postman collection (no example bodies),
 * so every mapper below reads several plausible key names (camelCase / PascalCase)
 * and falls back to '—' rather than throwing. Treat docs_business/admin-dashboard/
 * BACKEND_HANDOFF.md's "Wiring notes" section as the list of assumptions to confirm
 * with the backend team.
 */
(function(global){
'use strict';

const BASE_KEY='xstore_admin_api_base';
const TOKEN_KEY='xstore_admin_token';

function getBaseUrl(){ return localStorage.getItem(BASE_KEY)||'http://localhost:5000'; }
function setBaseUrl(v){ localStorage.setItem(BASE_KEY,(v||'').replace(/\/+$/,'')); }
function getToken(){ return localStorage.getItem(TOKEN_KEY)||''; }
function setToken(t){ if(t) localStorage.setItem(TOKEN_KEY,t); }
function clearToken(){ localStorage.removeItem(TOKEN_KEY); }

class ApiError extends Error{
 constructor(status,message,body){ super(message); this.status=status; this.body=body; }
}

function qs(params){
 if(!params) return '';
 const parts=Object.keys(params)
   .filter(k=>params[k]!==undefined&&params[k]!==null&&params[k]!=='')
   .map(k=>encodeURIComponent(k)+'='+encodeURIComponent(params[k]));
 return parts.length?'?'+parts.join('&'):'';
}

/* core request — sends the JWT via both headers per the collection description */
async function request(path,{method='GET',params,body,isForm=false}={}){
 const url=getBaseUrl()+path+qs(params);
 const headers={};
 const token=getToken();
 if(token){ headers['Authorization']='Bearer '+token; headers['X-Auth-Token']=token; }
 let payload=body;
 if(body&&!isForm){ headers['Content-Type']='application/json'; payload=JSON.stringify(body); }
 let res;
 try{
   res=await fetch(url,{method,headers,body:payload});
 }catch(networkErr){
   throw new ApiError(0,'Could not reach '+getBaseUrl()+' — check the API base URL and that the backend is running.',null);
 }
 if(res.status===401){
   clearToken();
   global.dispatchEvent(new CustomEvent('xstore:unauthorized'));
   throw new ApiError(401,'Session expired — please sign in again.',null);
 }
 const text=await res.text();
 let json=null;
 if(text){ try{ json=JSON.parse(text); }catch(e){ json=null; } }
 if(!res.ok){
   const msg=(json&&(json.message||json.title||json.error))||res.statusText||('HTTP '+res.status);
   throw new ApiError(res.status,msg,json);
 }
 return json;
}

/* ---------- response-shape helpers ---------- */
const pick=(o,...keys)=>{ if(!o) return undefined; for(const k of keys){ if(o[k]!==undefined&&o[k]!==null) return o[k]; } return undefined; };
const num=(v,fallback=0)=>{ const n=Number(v); return Number.isFinite(n)?n:fallback; };

/* GET-list endpoints aren't documented with example bodies — accept a raw array or a
 * common pagination envelope ({items|data|result|results|...}, total|totalCount|count). */
function unwrapList(json){
 if(Array.isArray(json)) return {items:json,total:json.length};
 if(!json) return {items:[],total:0};
 const items=pick(json,'items','data','result','results','vendors','users','listings','orders','categories','banners')||[];
 const total=num(pick(json,'total','totalCount','count'),items.length);
 return {items:Array.isArray(items)?items:[],total};
}

/* ---------- API data mappers ----------
 * The Postman collection doesn't include example response bodies, so these read
 * several plausible key names and fall back to '—' / 0 rather than throwing. See
 * BACKEND_HANDOFF.md for the shapes these are guessing at. */
async function safeCall(fn,fallback){
 try{ return {ok:true,data:await fn()}; }
 catch(e){ return {ok:false,error:e,data:fallback}; }
}
function mapVendor(v){
 const p=API.pick;
 return {
   id:API.id(v),
   n:p(v,'name','businessName','n')||'—',
   owner:p(v,'ownerName','owner')||'—',
   city:p(v,'city')||'—',
   cat:p(v,'category','categoryName','cat')||'—',
   status:vendorStatusKey(p(v,'status','vendorStatus')),
   products:API.num(p(v,'products','productsCount','listingsCount'),0),
   gmv:API.num(p(v,'gmv','gmvEgp'),0),
   rating:API.num(p(v,'rating'),0),
   vok:!!p(v,'verified','isVerified'),
   joined:p(v,'joined','joinedAt','createdAt')||'—',
   wa:p(v,'whatsapp','phoneNumber','phone')||'—',
   email:p(v,'email')||'—',
   raw:v
 };
}
function vendorStatusKey(s){
 if(s===API.VendorStatus.PENDING||s==='Pending'||s==='pending') return 'pending';
 if(s===API.VendorStatus.REJECTED||s==='Rejected'||s==='rejected') return 'rejected';
 if(s==='Suspended'||s==='suspended') return 'suspended';
 return 'active'; // Approved (2) and anything unrecognised renders as active
}
function mapListing(l){
 const p=API.pick;
 return {
   id:API.id(l),
   vendorId:p(l,'vendorId','storeId','sellerId'),
   t:p(l,'title','name','productName')||'Untitled listing',
   v:p(l,'vendorName','vendor','storeName')||'—',
   vok:!!p(l,'vendorVerified'),
   cat:p(l,'category','categoryName','sub','subcategory')||'—',
   sub:p(l,'subcategory','sub')||'',
   price:API.num(p(l,'price'),0),
   cmp:API.num(p(l,'compareAt','compareAtPrice','cmp'),0),
   stock:API.num(p(l,'stock','quantity'),0),
   status:listingStatusKey(p(l,'status')),
   sold:API.num(p(l,'sold30d','sold'),0),
   rating:API.num(p(l,'rating'),0),
   isHotDeal:!!p(l,'isHotDeal','hotDeal'),
   emoji:'📦',
   raw:l
 };
}
function listingStatusKey(s){
 const LS=API.ListingStatus;
 if(s===LS.PENDING||s==='Pending') return 'pending';
 if(s===LS.ACTIVE||s==='Active') return 'live';
 if(s===LS.SOLD||s==='Sold') return 'out';
 if(s===LS.REJECTED||s==='Rejected') return 'rejected';
 if(s===LS.PAUSED||s==='Paused') return 'paused';
 if(s===LS.CANCELLED||s==='Cancelled') return 'cancelled';
 return 'pending';
}
function mapOrder(o){
 const p=API.pick;
 const items=p(o,'items')||[];
 return {
   id:API.id(o)!=null?String(API.id(o)):(p(o,'orderNumber','code')||'—'),
   buyer:p(o,'buyer','buyerName','customerName')||'—',
   phone:p(o,'phone','buyerPhone')||'—',
   addr:p(o,'address','deliveryAddress')||'—',
   vendor:p(o,'vendorName','vendor','storeName')||'—',
   status:orderStatusKey(p(o,'status')),
   total:API.num(p(o,'total','totalAmount','totalEgp','amount'),
     Array.isArray(items)?items.reduce((s,it)=>s+API.num(p(it,'qty','quantity'),0)*API.num(p(it,'unitPrice','price'),0),0):0),
   courier:p(o,'courierName','courier')||null,
   items:Array.isArray(items)?items.map(it=>[p(it,'title','name')||'Item',API.num(p(it,'qty','quantity'),1),API.num(p(it,'unitPrice','price'),0)]):[],
   raw:o
 };
}
function orderStatusKey(s){
 const OS=API.OrderStatus;
 const map={};map[OS.PENDING]='pending';map[OS.CONFIRMED]='confirmed';map[OS.PROCESSING]='processing';map[OS.SHIPPED]='shipped';map[OS.DELIVERED]='delivered';map[OS.CANCELLED]='cancelled';
 if(typeof s==='number'&&map[s]) return map[s];
 if(typeof s==='string'&&OSTAT[s.toLowerCase()]) return s.toLowerCase();
 return 'pending';
}
function mapUser(u){
 const p=API.pick;
 return {
   id:API.id(u),
   n:p(u,'name','fullName','userName')||'—',
   phone:p(u,'phoneNumber','phone')||'—',
   role:p(u,'role')||'—',
   city:p(u,'city')||'—',
   joined:p(u,'joined','createdAt')||'—',
   isVerified:!!p(u,'isVerified','verified'),
   raw:u
 };
}
function mapCategory(c){
 const p=API.pick;
 return {id:API.id(c),nameEn:p(c,'nameEn','name')||'—',nameAr:p(c,'nameAr')||'',parentId:p(c,'parentId'),isActive:p(c,'isActive')!==false,imageUrl:p(c,'imageUrl','image'),raw:c};
}
function mapBanner(b){
 const p=API.pick;
 return {id:API.id(b),nameEn:p(b,'nameEn','name')||'—',nameAr:p(b,'nameAr')||'',sortOrder:API.num(p(b,'sortOrder'),0),isActive:p(b,'isActive')!==false,imageUrl:p(b,'imageUrl','image'),raw:b};
}

     ${p.status==='submitted'
       ?`<button class="btn btn-no btn-sm" onclick="cancelPkg(${i})" title="Cancel request">✕</button>`
       :`<button class="btn btn-g btn-sm" onclick="PKG_EDIT=-1;go('packages')">Back</button>`}</div>${priceHint}`;

     +`<small class="hint">Courier collects ${EGP(p.price)} in cash at pickup</small>`;

   return `<span class="badge-s b-indigo" title="Assigned courier">🚚 ${p.courier.split(' ')[0]}</span> <button class="btn btn-g btn-sm" onclick="pkgDrawer(${i})">View</button><small class="hint">💵 Cash collected at pickup: ${EGP(p.price)}</small>`;

}

function setPkgPrice(i){

 if(isNaN(amt)||amt<=0){toast('Enter a valid price');document.getElementById('pkgPr-'+i).focus();return;}
 const first=p.status==='submitted';
 p.price=Math.round(amt*100)/100;p.status='priced';PKG_EDIT=-1;
 toast(first?p.id+' priced at '+EGP(p.price)+' — customer asked to confirm ✓':'Price updated to '+EGP(p.price)+' — customer notified ✓');
 go('packages');refreshPkgBadge();
}

function cancelPkg(i){

 p.status='cancelled';PKG_EDIT=-1;
 toast(p.id+' cancelled — customer notified');

function syncOverlay(){
 const show=document.getElementById('drawer').classList.contains('show')||document.querySelector('.sidebar').classList.contains('open');
 document.getElementById('overlay').classList.toggle('show',show);
}
function toggleSidebar(){document.querySelector('.sidebar').classList.toggle('open');syncOverlay();}
function closeSidebar(){document.querySelector('.sidebar').classList.remove('open');syncOverlay();}

/* ---------- router ----------
 * VIEWS[v] may be sync (mock-only views) or async (views backed by API.js loaders,
 * see "wired views" below) — go() awaits either. */
let GO_SEQ=0;
async function go(v){
 const seq=++GO_SEQ;
 document.getElementById('topTitle').textContent=TITLES[v];
 document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active',a.dataset.view===v));
 const s=document.getElementById('searchInput'); if(s) s.value='';
 closeSidebar();
 window.scrollTo(0,0);
 const content=document.getElementById('content');
 content.innerHTML=stateCard('Loading…');
 let html;
 try{
   html=await VIEWS[v]();
 }catch(err){
   if(seq!==GO_SEQ) return;
   content.innerHTML=stateCard(err&&err.message?err.message:'Something went wrong loading this page.',true,v);
   return;
 }
 if(seq!==GO_SEQ) return; // a newer navigation started while this one was loading
 content.innerHTML=html;
}
function stateCard(msg,isError,retryView){
 return '<div class="card"><div class="c-body"><div class="state-card'+(isError?' error':'')+'">'
   +(isError?'⚠️ ':'')+esc(msg)
   +(isError&&retryView?'<div><button class="btn btn-g" onclick="go(\''+retryView+'\')">Retry</button></div>':'')
   +'</div></div></div>';
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
document.querySelectorAll('#nav a').forEach(a=>a.onclick=()=>go(a.dataset.view));

/* ---------- toast + moderation ---------- */
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}
async function decide(i,action){
 const p=PENDING[i]; if(!p)return;
 let reason;
 if(action==='reject'){
   reason=prompt('Rejection reason (shown to the vendor):','');
   if(reason===null) return; // cancelled
 }
 try{
   if(action==='approve') await API.Listings.approve(p.id);
   else if(action==='reject') await API.Listings.reject(p.id,reason||'');
   else { toast('Not supported by the current API'); return; }
 }catch(e){ toast(e.message||'Action failed'); return; }
 const msg={approve:'Listing approved — now live ✓',reject:'Listing rejected — vendor notified'};
 toast(msg[action]||'Done');
 go('moderation'); // re-fetch so indices stay in sync with the server
}

 openDrawer('Vendor — '+v.n,

   +secH('Business profile')
   +kv('Owner',esc(v.owner))+kv('Primary category',esc(v.cat))+kv('Location',esc(v.city))+kv('Joined',esc(v.joined))+kv('Products',v.products||'—')+kv('GMV',v.gmv?EGP(v.gmv):'—')+kv('Rating',v.rating?'⭐ '+v.rating:'—')
   +'<div style="margin-top:8px"><a style="cursor:pointer;color:var(--primary);font-size:12.5px;font-weight:600" onclick="closeDrawer();openVendorProducts('+i+',\'commission\')">View commission wallet →</a></div>'
   +secH('Contact')+kv('WhatsApp',esc(v.wa))+kv('Email',esc(v.email)),
   actions);
}
async function vdecide(i,action){
 const v=VENDORS[i]; if(!v) return;
 if(action==='suspend'||action==='reinstate'){
   toast('The current admin API has no suspend/reinstate endpoint yet — showing locally only.');
   v.status=action==='suspend'?'suspended':'active';
   closeDrawer();
   document.getElementById('content').innerHTML=vendorsTableHtml('');
   document.getElementById('topTitle').textContent='Vendors';
   document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active',a.dataset.view==='vendors'));
   return;
 }
 try{
   if(action==='approve') await API.Vendors.approve(v.id);
   else if(action==='reject') await API.Vendors.reject(v.id);
 }catch(e){ toast(e.message||'Action failed'); return; }
 toast({approve:'Vendor approved — now selling ✓',reject:'Vendor application rejected'}[action]||'Done');
 closeDrawer(); go('vendors');
 const pend=VENDORS.filter(x=>x.status==='pending').length;
 const b=document.querySelector('#nav a[data-view=vendors] .badge'); if(b){if(pend>0)b.textContent=pend;else b.remove();}
}

/* ---------- vendor page (listings + orders) ---------- */
const LSTAT={live:['b-green','Live'],pending:['b-amber','Pending'],out:['b-red','Out of stock']};
const emptyCard=(ico,title,sub)=>`<div class="card"><div class="c-body" style="text-align:center;padding:48px 24px">
   <div style="font-size:40px;margin-bottom:10px">${ico}</div><b style="font-size:15px">${title}</b>
   <p class="muted" style="font-size:13px;margin-top:4px">${sub}</p></div></div>`;
function vendorHeader(i,tab,listCount,ordCount){
 const v=VENDORS[i];
 const sm={active:['b-green','Active'],pending:['b-amber','Pending approval'],suspended:['b-red','Suspended'],rejected:['b-red','Rejected']}[v.status]||['b-grey',v.status];
 return `
  <div style="margin-bottom:14px"><a class="btn btn-g btn-sm" style="cursor:pointer" onclick="go('vendors')">← Back to vendors</a></div>
  <div class="page-head">
    <div style="display:flex;align-items:center;gap:14px">${avatar(v.n)}
      <div><h2 style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">${esc(v.n)} <span class="badge-s ${sm[0]}">${sm[1]}</span>${v.vok?'<span class="badge-s b-green">✓ verified</span>':''}</h2>
      <p>${esc(v.owner)} · ${esc(v.city)} · ${esc(v.cat)} · joined ${esc(v.joined)}</p></div></div>
    <button class="btn btn-p" onclick="vendorDrawer(${i})">Vendor details</button></div>
  <div class="tabs" style="margin-bottom:18px">
    <span class="chip ${tab==='listings'?'active':''}" onclick="event.stopPropagation();openVendorProducts(${i},'listings')">📦 Listings (${listCount})</span>
    <span class="chip ${tab==='orders'?'active':''}" onclick="event.stopPropagation();openVendorProducts(${i},'orders')">🧾 Orders (${ordCount})</span>
    <span class="chip ${tab==='commission'?'active':''}" onclick="event.stopPropagation();openVendorProducts(${i},'commission')">💳 Commission</span>
  </div>`;
}
async function vendorProducts(i,tab){
 tab=tab||'listings';
 const v=VENDORS[i]; if(!v) return stateCard('Vendor not found',true);

 if(tab==='commission') return vendorHeader(i,tab,(VLISTINGS[i]||[]).length,0)+await commissionPaneHtml(i);

 const [listRes,ordRes]=await Promise.all([
   safeCall(()=>API.Listings.list({pageSize:200}),{items:[]}),
   safeCall(()=>loadOrders(),null)
 ]);
 const allListings=(listRes.data.items||[]).map(mapListing);
 const list=allListings.filter(l=>(v.id!=null&&l.vendorId!=null)?String(l.vendorId)===String(v.id):l.v===v.n);
 VLISTINGS[i]=list;
 const vOrders=ORDERS.map((o,idx)=>({o,idx})).filter(x=>x.o.vendor===v.n);
 const apiNote=(listRes.ok?'':`<div class="api-note">⚠️ Couldn't load /api/admin/listings: ${esc(listRes.error.message)}</div>`)
   +(ordRes.ok?`<div class="api-note">Note: there's no per-vendor order endpoint yet — this is the full order list filtered by vendor name client-side.</div>`:`<div class="api-note">⚠️ Couldn't load /api/admin/orders: ${esc(ordRes.error.message)}</div>`);
 const header=vendorHeader(i,tab,list.length,vOrders.length);

 if(tab==='orders'){
   const delivered=vOrders.filter(x=>x.o.status==='delivered').length;
   const ordVal=vOrders.reduce((s,x)=>s+orderTotal(x.o),0);
   const kpis=`<div class="grid g-4" style="margin-bottom:18px">
     ${kpi('box',String(vOrders.length),'Orders','','up','#2E5C6E')}
     ${kpi('shield',String(delivered),'Delivered','','up','#3F7A5C')}
     ${kpi('alert',String(vOrders.length-delivered),'In progress','','down','#C68A2E')}
     ${kpi('chart',ordVal?EGP(ordVal):'—','Order value','','up','#356F80')}</div>`;
   const rows=vOrders.map(({o,idx})=>`<tr data-status="${o.status}"><td><b>${esc(o.id)}</b></td>
     <td><div class="u">${avatar(o.buyer)}<b>${esc(o.buyer)}</b></div></td>
     <td class="muted">${o.items.map(it=>esc(it[0])+' ×'+it[1]).join(', ')}</td>
     <td class="money">${EGP(orderTotal(o))}</td><td><span class="badge-s b-grey">COD</span></td>
     <td><span class="badge-s ${OSTAT[o.status][0]}">${OSTAT[o.status][1]}</span></td>
     <td class="r"><button class="btn btn-g btn-sm" onclick="orderDrawer(${idx})">View</button></td></tr>`).join('');
   const pane=vOrders.length
     ?`<div class="card"><table><thead><tr><th>Order</th><th>Buyer</th><th>Items</th><th>Total</th><th>Payment</th><th>Status</th><th class="r"></th></tr></thead><tbody>${rows}</tbody></table></div>`
     :emptyCard('🧾','No orders yet',v.status==='pending'?'This vendor is still pending approval and hasn’t received any orders.':'This vendor has no orders right now.');
   return header+apiNote+kpis+pane;
 }

 // listings tab
 const live=list.filter(p=>p.status==='live').length;
 const pend=list.filter(p=>p.status==='pending').length;
 const kpis=`<div class="grid g-4" style="margin-bottom:18px">
   ${kpi('box',String(list.length),'Total listings','','up','#2E5C6E')}
   ${kpi('shield',String(live),'Live','','up','#3F7A5C')}
   ${kpi('alert',String(pend),'Pending review','','down','#C68A2E')}
   ${kpi('chart',v.gmv?EGP(v.gmv):'—','GMV (30d)','','up','#356F80')}</div>`;
 const rows=list.map((p,pi)=>{const cmp=p.cmp?` <small style="text-decoration:line-through;color:var(--text-3)">${EGP(p.cmp)}</small>`:'';
   return `<tr data-status="${p.status}"><td><div class="u" style="cursor:pointer" onclick="listingDrawer(${i},${pi})"><span class="ua" style="background:linear-gradient(135deg,#EAF0F1,#DAE6E9);font-size:18px">${p.emoji}</span><div><b>${esc(p.t)}</b><small>${esc(p.sub)}</small></div></div></td>
     <td class="money">${EGP(p.price)}${cmp}</td>
     <td>${p.stock||'—'}</td>
     <td>${p.sold}</td>
     <td>${p.rating?'⭐ '+p.rating:'—'}</td>
     <td><span class="badge-s ${LSTAT[p.status]?LSTAT[p.status][0]:'b-grey'}">${LSTAT[p.status]?LSTAT[p.status][1]:p.status}</span></td>
     <td class="r"><button class="btn btn-g btn-sm" onclick="listingDrawer(${i},${pi})">View</button></td></tr>`}).join('');
 const pane=list.length
   ? `<div class="card"><table><thead><tr><th>Product</th><th>Price</th><th>Stock</th><th>Sold (30d)</th><th>Rating</th><th>Status</th><th class="r"></th></tr></thead><tbody>${rows}</tbody></table></div>`
   : emptyCard('📦','No listings yet',v.status==='pending'?'This vendor is still pending approval and hasn’t published any products.':'This vendor has no products listed.');
 return header+apiNote+kpis+pane;
}
async function openVendorProducts(i,tab){
 tab=tab||'listings';
 const v=VENDORS[i]; if(!v) return;
 document.getElementById('content').innerHTML=stateCard('Loading…');
 document.getElementById('topTitle').textContent=v.n+(tab==='orders'?' · Orders':tab==='commission'?' · Commission':' · Listings');
 document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active',a.dataset.view==='vendors'));
 const s=document.getElementById('searchInput'); if(s) s.value='';
 window.scrollTo(0,0);
 try{
   document.getElementById('content').innerHTML=await vendorProducts(i,tab);
 }catch(e){
   document.getElementById('content').innerHTML=stateCard(e.message||'Failed to load',true);
 }
}
async function commissionPaneHtml(i){
 const v=VENDORS[i];
 const res=await safeCall(()=>API.Vendors.commission(v.id),{outstanding:0,warn:0,pause:0});
 const c=res.data,lvl=commLevel(c);
 const apiNote=res.ok?'':`<div class="api-note">⚠️ Couldn't load /api/admin/vendors/${esc(String(v.id))}/commission: ${esc(res.error.message)}</div>`;
 const badge={none:['b-green','Healthy'],warn:['b-amber','Warn — near limit'],paused:['b-red','Paused — publishing blocked']}[lvl];
 const banner=lvl==='none'?''
   :`<div style="display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:12px;margin-bottom:18px;background:${lvl==='paused'?'var(--error-bg)':'var(--warning-bg)'};color:${lvl==='paused'?'#8A3A24':'#7E5A14'}">
       <span style="font-size:20px">${lvl==='paused'?'⛔':'⚠️'}</span>
       <div><b>${lvl==='paused'?'Publishing blocked':'Approaching the pause limit'}</b>
       <p style="font-size:12.5px;margin-top:2px">${lvl==='paused'
         ?`This vendor owes <b>${EGP(c.outstanding)}</b> (≥ pause threshold ${EGP(c.pause)}). New listing publishes are held until the balance is paid down.`
         :`This vendor owes <b>${EGP(c.outstanding)}</b> (≥ warn threshold ${EGP(c.warn)}). Notify them to pay before publishing is paused at ${EGP(c.pause)}.`}</p></div></div>`;
 const kpis=`<div class="grid g-4" style="margin-bottom:18px">
   ${kpi('chart',EGP(c.outstanding),'Outstanding balance','','down',lvl==='paused'?'#B4472E':lvl==='warn'?'#C68A2E':'#3F7A5C')}
   ${kpi('alert',EGP(c.warn),'Warn threshold','','up','#C68A2E')}
   ${kpi('shield',EGP(c.pause),'Pause threshold','','up','#B4472E')}
   ${kpi('box','—','Commission rate','see Settings','up','#356F80')}</div>`;
 const form=`<div class="card"><div class="c-head"><h3>Weekly owed-balance thresholds (EGP)</h3><span class="badge-s ${badge[0]}">${badge[1]}</span></div>
   <div class="c-body">
     <div class="form-row"><label>Warn threshold — notify the vendor to pay</label><input id="warnTh" inputmode="numeric" value="${c.warn}"></div>
     <div class="form-row"><label>Pause threshold — block new listing publishes</label><input id="pauseTh" inputmode="numeric" value="${c.pause}"></div>
     <p class="muted" style="font-size:12px;margin:-4px 0 14px">Pause must be ≥ warn. At/above <b>warn</b> the vendor is notified; at/above <b>pause</b> new publishes are blocked until paid.</p>
     <button class="btn btn-p" style="width:100%;justify-content:center" onclick="saveCommThresholds(${i})">Save thresholds</button></div></div>`;
 const owedColor=lvl==='paused'?'#B4472E':lvl==='warn'?'#C68A2E':'#2C6347';
 const pay=`<div class="card"><div class="c-head"><h3>Collect payment</h3><span class="badge-s ${badge[0]}">${badge[1]}</span></div>
   <div class="c-body">
     <p class="muted" style="font-size:13px">Amount this vendor owes the platform right now:</p>
     <div style="font-size:30px;font-weight:800;color:${owedColor};margin:6px 0 14px;font-variant-numeric:tabular-nums">${EGP(c.outstanding)}</div>
     ${c.outstanding>0
       ?`<div class="form-row"><label>Amount received from vendor (EGP)</label><input id="payAmt" inputmode="numeric" value="${c.outstanding}"></div>
         <div style="display:flex;gap:8px"><button class="btn btn-ok" style="flex:1;justify-content:center" onclick="recordPayment(${i})">Record payment</button>
         <button class="btn btn-g" style="flex:1;justify-content:center" onclick="resetWallet(${i})">Mark fully paid</button></div>`
       :`<div style="padding:14px 16px;background:var(--success-bg);color:#2C6347;border-radius:11px;font-size:13px;font-weight:600">✓ Wallet settled — nothing to collect.</div>`}</div></div>`;
 const info=`<div class="card"><div class="c-body" style="font-size:12.5px;line-height:1.7;color:var(--text-2)">
     <b style="color:var(--text)">How the wallet works</b>
     <p style="margin-top:6px">Unpaid commission accrues as the vendor's <b>outstanding balance</b>, settled weekly. When the vendor pays you, hit <b>Record payment</b> (partial) or <b>Mark fully paid</b> to reset the wallet to EGP 0.</p>
     <p style="margin-top:8px">Below warn → <span class="badge-s b-green">Healthy</span> · ≥ warn → <span class="badge-s b-amber">Warn</span> · ≥ pause → <span class="badge-s b-red">Paused</span> (publishing blocked).</p>
     <p style="margin-top:8px">Backend: <code>POST /api/admin/vendors/{id}/commission/settle</code> · <code>PATCH /api/admin/vendors/{id}/commission</code>.</p></div></div>`;
 return apiNote+kpis+banner+`<div class="split">${pay}${form}</div><div class="mt">${info}</div>`;
}
async function resetWallet(i){
 const v=VENDORS[i];
 try{ await API.Vendors.settleCommission(v.id); }
 catch(e){ toast(e.message||'Action failed'); return; }
 toast('Payment recorded — wallet reset to EGP 0 ✓');
 openVendorProducts(i,'commission');
}
async function recordPayment(i){
 const v=VENDORS[i];
 const amt=parseFloat(document.getElementById('payAmt').value);
 if(isNaN(amt)||amt<=0){toast('Enter a valid amount');document.getElementById('payAmt').focus();return;}
 try{ await API.Vendors.settleCommission(v.id,amt); }
 catch(e){ toast(e.message||'Action failed'); return; }
 toast('Payment recorded ✓');
 openVendorProducts(i,'commission');
}
async function saveCommThresholds(i){
 const v=VENDORS[i];
 const warn=parseFloat(document.getElementById('warnTh').value);
 const pause=parseFloat(document.getElementById('pauseTh').value);
 if(isNaN(warn)||warn<0){toast('Enter a valid warn threshold');document.getElementById('warnTh').focus();return;}
 if(isNaN(pause)||pause<0){toast('Enter a valid pause threshold');document.getElementById('pauseTh').focus();return;}
 if(pause<warn){toast('Pause threshold must be ≥ warn threshold');document.getElementById('pauseTh').focus();return;}
 try{ await API.Vendors.updateCommissionThresholds(v.id,warn,pause); }
 catch(e){ toast(e.message||'Action failed'); return; }
 toast('Commission thresholds saved ✓');
 openVendorProducts(i,'commission');
}

   +kv('Vendor (business)',esc(v.n))+kv('Category',esc(v.cat)+' › '+esc(p.sub))+kv('Price',EGP(p.price))+(p.cmp?kv('Compare-at',EGP(p.cmp)):'')+kv('In stock',p.stock)+kv('Sold (30d)',p.sold)+kv('Rating',p.rating?'⭐ '+p.rating:'—'),

async function decideListing(vi,pi,action){
 const p=(VLISTINGS[vi]||[])[pi]; if(!p) return;
 let reason;
 if(action==='reject'){ reason=prompt('Rejection reason (shown to the vendor):',''); if(reason===null) return; }
 try{
   if(action==='approve') await API.Listings.approve(p.id);
   else await API.Listings.reject(p.id,reason||'');
 }catch(e){ toast(e.message||'Action failed'); return; }
 toast(action==='approve'?'Listing approved — now live ✓':'Listing rejected — vendor notified');
 closeDrawer(); openVendorProducts(vi,'listings');
}
async function toggleHotDeal(vi,pi){
 const p=(VLISTINGS[vi]||[])[pi]; if(!p) return;
 try{ await API.Listings.setHotDeal(p.id,!p.isHotDeal); }
 catch(e){ toast(e.message||'Action failed'); return; }
 toast(p.isHotDeal?'Removed from hot deals':'Marked as a hot deal ✓');
 closeDrawer(); openVendorProducts(vi,'listings');
}

/* ---------- reusable add-form (opens in the drawer, actually adds) ---------- */
function formDrawer(title,fields,submitLabel,onSubmit,values){
 const esc=s=>String(s).replace(/"/g,'&quot;');
 const body=fields.map((f,i)=>{const val=values&&values[i]!=null?values[i]:'';
   return f.type==='select'
   ?'<div class="form-row"><label>'+f.label+'</label><select id="ff'+i+'">'+f.options.map(o=>'<option'+(o===val?' selected':'')+'>'+o+'</option>').join('')+'</select></div>'
   :'<div class="form-row"><label>'+f.label+(f.required?' *':'')+'</label><input id="ff'+i+'" value="'+esc(val)+'" placeholder="'+(f.ph||'')+'"></div>';}).join('');
 window._submitForm=function(){
   const vals=fields.map((f,i)=>document.getElementById('ff'+i).value.trim());
   for(let i=0;i<fields.length;i++){if(fields[i].required&&!vals[i]){toast('Please fill in: '+fields[i].label);document.getElementById('ff'+i).focus();return;}}
   onSubmit(vals);
 };
 openDrawer(title,body,'<button class="btn btn-g" style="flex:1;justify-content:center" onclick="closeDrawer()">Cancel</button><button class="btn btn-p" style="flex:1;justify-content:center" onclick="_submitForm()">'+submitLabel+'</button>');
}

 [{label:'Code',ph:'SUMMER25',required:true},{label:'Offer description',ph:'25% off orders over EGP 500',required:true},{label:'Scope',type:'select',options:['Platform','Seasonal']}],
 'Create coupon',v=>{COUPONS.push([v[0].toUpperCase(),v[1],v[2],0,true]);toast('Coupon "'+v[0].toUpperCase()+'" created ✓');closeDrawer();go('coupons');});}
function openBannerForm(i){
 const editing=i!=null,b=editing?BANNERS_API[i]:null;
 const body=`<div class="form-row"><label>Name (English)</label><input id="banNameEn" value="${b?esc(b.nameEn):''}"></div>
  <div class="form-row"><label>Name (Arabic)</label><input id="banNameAr" value="${b?esc(b.nameAr):''}"></div>
  <div class="form-row"><label>Sort order</label><input id="banSort" inputmode="numeric" value="${b?b.sortOrder:1}"></div>
  <label style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-2);margin-bottom:14px"><input id="banActive" type="checkbox" style="width:auto"${!b||b.isActive?' checked':''}> Active</label>

 openDrawer(editing?'Edit banner':'New banner',body,
  '<button class="btn btn-g" style="flex:1;justify-content:center" onclick="closeDrawer()">Cancel</button><button class="btn btn-p" style="flex:1;justify-content:center" onclick="submitBannerForm('+(editing?i:'null')+')">'+(editing?'Save changes':'Add banner')+'</button>');
}
async function submitBannerForm(i){
 const nameEn=document.getElementById('banNameEn').value.trim();
 const nameAr=document.getElementById('banNameAr').value.trim();
 if(!nameEn||!nameAr){toast('Enter both English and Arabic names');return;}
 const sortOrder=parseInt(document.getElementById('banSort').value,10)||0;
 const isActive=document.getElementById('banActive').checked;
 const files=document.getElementById('banImage').files;
 const imageFile=files&&files[0]?files[0]:undefined;
 if(i==null&&!imageFile){toast('An image is required to create a banner');return;}
 try{
   if(i!=null) await API.Banners.update({bannerId:BANNERS_API[i].id,nameEn,nameAr,sortOrder,isActive,imageFile});
   else await API.Banners.create({nameEn,nameAr,sortOrder,isActive,imageFile});
 }catch(e){ toast(e.message||'Save failed'); return; }
 toast(i!=null?'Banner updated ✓':'Banner added ✓');
 closeDrawer(); go('content');
}
function openInviteForm(){formDrawer('Invite team member',
 [{label:'Full name',ph:'Full name',required:true},{label:'Email',ph:'name@xstore.eg',required:true},{label:'Role',type:'select',options:['Super Admin','Moderator','Viewer']}],
 'Send invite',v=>{const d={'Super Admin':'Full access','Moderator':'Orders + disputes','Viewer':'Read-only reports'}[v[2]]||'';TEAM.push([v[0],v[2],d]);toast('Invite sent to '+v[1]+' ✓');closeDrawer();go('settings');});}
function openAnnouncementForm(){formDrawer('New announcement',
 [{label:'Title',ph:'Scheduled maintenance tonight',required:true},{label:'Audience',type:'select',options:['All users','Vendors only','Customers only']},{label:'Message',ph:'Short message…'}],
 'Publish',v=>{toast('Announcement published to '+v[1]+' ✓');closeDrawer();});}
function createCouponInline(){
 const code=document.getElementById('ciCode').value.trim();
 if(!code){toast('Enter a coupon code');document.getElementById('ciCode').focus();return;}
 const type=document.getElementById('ciType').value,val=document.getElementById('ciVal').value.trim(),min=document.getElementById('ciMin').value.trim();
 let offer=type==='Free delivery'?'Free delivery':type==='Percentage'?(val||'?')+'% off':'EGP '+(val||'?')+' off';
 if(min) offer+=' (min EGP '+min+')';
 COUPONS.push([code.toUpperCase(),offer,'Platform',0,true]);
 toast('Coupon "'+code.toUpperCase()+'" created ✓');go('coupons');
}
function sendBroadcast(){const t=document.getElementById('pbTitle').value.trim();if(!t){toast('Enter a title');return;}toast('Broadcast sent to '+document.getElementById('pbAud').value+' ✓');}
function editCoupon(i){const c=COUPONS[i];formDrawer('Edit coupon',
 [{label:'Code',required:true},{label:'Offer description',required:true},{label:'Scope',type:'select',options:['Platform','Seasonal']}],
 'Save changes',v=>{COUPONS[i]=[v[0].toUpperCase(),v[1],v[2],c[3],c[4]];toast('Coupon "'+v[0].toUpperCase()+'" updated ✓');closeDrawer();go('coupons');},
 [c[0],c[1],c[2]]);}
function deleteCoupon(i){const c=COUPONS[i][0];COUPONS.splice(i,1);toast('Coupon "'+c+'" deleted');go('coupons');}
async function deleteBanner(i){
 const b=BANNERS_API[i]; if(!b) return;
 if(!confirm('Delete banner "'+b.nameEn+'"? This cannot be undone.')) return;
 try{ await API.Banners.remove(b.id); }
 catch(e){ toast(e.message||'Delete failed'); return; }
 toast('Banner deleted');
 go('content');
}

/* ---------- filter chips ---------- */
const STATUSES=['pending','confirmed','processing','shipped','delivered','cancelled','active','suspended','open','review','resolved','approved','rejected','live','out','off','submitted','priced','pickedup'];
function onChip(chip){
 const g=chip.closest('.tabs'); if(g) g.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',c===chip));
 const label=chip.innerText.replace(/\s*\(\d+\)/,'').trim();
 let key=label.toLowerCase(); if(key==='in review') key='review'; if(key==='out of stock') key='out'; if(key==='off duty') key='off'; if(key==='picked up') key='pickedup';
 const view=document.getElementById('content');
 const rows=[...view.querySelectorAll('tr[data-status]')];
 const cards=[...view.querySelectorAll('.mod[data-status]')];
 const items=rows.length?rows:cards;
 if(!items.length){toast('View: '+label);return;}
 if(key==='all'||!STATUSES.includes(key)){items.forEach(el=>el.style.display='');toast('Showing all');return;}
 const matched=items.filter(el=>el.dataset.status===key);
 if(matched.length){items.forEach(el=>el.style.display=matched.indexOf(el)>-1?'':'none');toast(matched.length+' '+label);}
 else{items.forEach(el=>el.style.display='');toast('No '+label+' in demo data — showing all');}
}

/* ---------- generic CTA ---------- */
function onCTA(btn){
 const t=btn.innerText.trim();
 if(/^edit$/i.test(t)){toast('Opening editor…');return;}
 if(/^preview$/i.test(t)){toast('Opening preview…');return;}
 if(/export/i.test(t)){toast('Export started — CSV will download');return;}
 if(t[0]==='+'){toast(t.slice(1).trim()+' — opening form');return;}
 toast(t);
}

/* ---------- search ---------- */
function searchRows(q){
 q=q.trim().toLowerCase();
 const els=document.querySelectorAll('#content tr[data-status], #content .mod[data-status]');
 els.forEach(el=>{el.style.display=(!q||el.innerText.toLowerCase().indexOf(q)>-1)?'':'none';});
}

/* ---------- delegated clicks (wires every CTA) ---------- */
document.addEventListener('click',e=>{
 const jump=e.target.closest('[data-jump]'); if(jump){go(jump.dataset.jump);return;}
 const chip=e.target.closest('.chip'); if(chip){onChip(chip);return;}
 const ib=e.target.closest('.icon-btn'); if(ib){toast(ib.querySelector('[data-ic="bell"]')?'No new notifications':'Help & documentation');return;}
 const btn=e.target.closest('.btn'); if(btn&&!btn.getAttribute('onclick')){onCTA(btn);return;}
});
document.getElementById('searchInput').addEventListener('input',e=>searchRows(e.target.value));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();closeSidebar();}});

document.querySelectorAll('[data-ic]').forEach(e=>e.innerHTML=ic(e.dataset.ic));

/* ---------- auth gate ---------- */
function showLogin(){
 document.getElementById('appShell').style.display='none';
 document.getElementById('loginScreen').style.display='flex';
 document.getElementById('liBase').value=API.getBaseUrl();
}
function showApp(){
 document.getElementById('loginScreen').style.display='none';
 document.getElementById('appShell').style.display='flex';
 go('overview');
}
async function handleLoginSubmit(ev){
 ev.preventDefault();
 const base=document.getElementById('liBase').value.trim();
 if(base) API.setBaseUrl(base);
 const phone=document.getElementById('liPhone').value.trim();
 const pass=document.getElementById('liPass').value;
 const remember=document.getElementById('liRemember').checked;
 const err=document.getElementById('loginError'); err.style.display='none';
 const btn=document.getElementById('loginSubmitBtn'); btn.disabled=true; btn.textContent='Signing in…';
 try{
   await API.Auth.login(phone,pass,remember);
   showApp();
 }catch(e){
   err.textContent=e&&e.message?e.message:'Sign in failed.';
   err.style.display='block';
 }finally{
   btn.disabled=false; btn.textContent='Sign in';
 }
 return false;
}
function handleLogout(){
 API.Auth.logout();
 toast('Signed out');
 showLogin();
}
window.addEventListener('xstore:unauthorized',()=>{ toast('Session expired — please sign in again'); showLogin(); });

/* boot */
if(API.isAuthenticated()) showApp(); else showLogin();

</script>
